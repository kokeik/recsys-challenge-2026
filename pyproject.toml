[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turn-aware-music-recommender"
version = "0.1.0"
description = "Turn-aware candidate retrieval and learning-to-rank for conversational music recommendation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Keijiro Konishi" }]
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
item2vec = ["gensim>=4.3,<5", "scipy>=1.10,<2"]
lambdarank = ["lightgbm>=4.0,<5"]
dev = ["pytest>=8,<9", "ruff>=0.6"]
all = [
  "gensim>=4.3,<5",
  "scipy>=1.10,<2",
  "lightgbm>=4.0,<5",
  "pytest>=8,<9",
  "ruff>=0.6",
]

[project.scripts]
turnaware-demo = "turnaware_recsys.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

